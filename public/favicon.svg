<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container for high contrast across both light and dark browser tabs -->
  <rect width="32" height="32" rx="7" fill="#020617" stroke="#0e7490" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Glowing background aura -->
  <circle cx="16" cy="15.5" r="7" fill="url(#centerGlow)"/>

  <!-- Cyber Shield Geometry -->
  <path d="M 16 6.5 C 20.2 6.5 24.2 8 24.5 9.5 C 24.5 17.2 21 22.8 16 26 C 11 22.8 7.5 17.2 7.5 9.5 C 7.8 8 11.8 6.5 16 6.5 Z"
        fill="url(#shieldFill)"
        stroke="url(#shieldBorder)"
        stroke-width="1.4"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Radar Reticle / Correlation Target -->
  <circle cx="16" cy="15" r="4.2" stroke="#22d3ee" stroke-width="0.9" stroke-dasharray="2 1.5" stroke-opacity="0.8"/>
  <circle cx="16" cy="15" r="1.8" fill="#38bdf8"/>

  <!-- Radar scanning axes -->
  <path d="M 16 9.5 L 16 11.5 M 16 18.5 L 16 21 M 10.5 15 L 12.5 15 M 19.5 15 L 21.5 15"
        stroke="#38bdf8"
        stroke-width="1"
        stroke-linecap="round"/>
</svg>